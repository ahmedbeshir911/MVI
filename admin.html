<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MVI Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#080a07}.admin{max-width:1100px;margin:auto;padding:35px 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.panel{background:#10120d;border:1px solid #292e24;border-radius:18px;padding:25px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.panel input,.panel textarea,.panel select{width:100%;box-sizing:border-box;background:#080a07;color:#fff;border:1px solid #30352a;border-radius:10px;padding:14px;font:inherit}.panel textarea{min-height:100px}.save{background:#d8ff3e;color:#080a07;border:0;border-radius:10px;padding:14px 20px;font-weight:900;cursor:pointer}.danger{color:#ff8b8b}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><main class="admin"><header class="admin-head"><div><a class="brand" href="index.html">MVI<span>.</span></a><p>لوحة الإدارة الخاصة</p></div><button class="save" onclick="logout()">تسجيل خروج</button></header><section id="login" class="panel"><h2>دخول الإدارة</h2><p>هذه المنطقة خاصة بفريق MVI.</p><input id="email" type="email" placeholder="البريد الإداري"><input id="pass" type="password" placeholder="كلمة المرور" style="margin-top:10px"><button class="save" style="margin-top:12px" onclick="login()">دخول</button><p id="err" class="danger"></p></section><div id="app" class="hidden"><section class="panel"><h2>العروض والباقات</h2><div class="grid"><label>اسم الباقة<input id="p1" value="Starter"></label><label>التصميمات يوميًا<input id="n1" value="1"></label><label>اسم الباقة<input id="p2" value="Growth"></label><label>التصميمات يوميًا<input id="n2" value="2"></label><label>اسم الباقة<input id="p3" value="Business"></label><label>التصميمات يوميًا<input id="n3" value="3"></label><label>اسم الباقة<input id="p4" value="Premium"></label><label>التصميمات يوميًا<input id="n4" value="5"></label></div><button class="save" style="margin-top:15px" onclick="save()">حفظ التغييرات</button><p id="saved"></p></section><section class="panel"><h2>إعدادات الموقع</h2><div class="grid"><label>العنوان الرئيسي<input id="hero" value="خلي براندك حاضر كل يوم."></label><label>نص التجربة<input id="trial" value="3 أيام مجانًا — تصميم واحد يوميًا"></label></div><button class="save" style="margin-top:15px" onclick="save()">حفظ</button></section></div></main><script>const KEY="mviAdminSession";function login(){var e=document.getElementById("email").value,p=document.getElementById("pass").value;if(e==="admin@mvi.local"&&p==="MVI-DEMO-2026"){sessionStorage.setItem(KEY,"1");show()}else document.getElementById("err").textContent="بيانات الدخول غير صحيحة."}function show(){loginBox=document.getElementById("login");loginBox.classList.add("hidden");document.getElementById("app").classList.remove("hidden");load()}function logout(){sessionStorage.removeItem(KEY);location.reload()}function save(){var x={p1:p1.value,n1:n1.value,p2:p2.value,n2:n2.value,p3:p3.value,n3:n3.value,p4:p4.value,n4:n4.value,hero:hero.value,trial:trial.value};localStorage.setItem("mviAdminData",JSON.stringify(x));document.getElementById("saved").textContent="تم الحفظ على هذا الجهاز."}function load(){var x=JSON.parse(localStorage.getItem("mviAdminData")||"{}");Object.keys(x).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=x[k]})}if(sessionStorage.getItem(KEY))show()</script></body></html>
