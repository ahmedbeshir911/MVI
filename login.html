<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول العميل | MVI</title><link rel="stylesheet" href="styles.css"></head><body><main class="trial-page"><a class="brand" href="index.html">MVI<span>.</span></a><section class="trial-card"><div class="eyebrow"><span></span> حساب العميل</div><h1>أهلاً <em>بك.</em></h1><p>سجّل دخولك لمتابعة تجربتك وتصميماتك.</p><form id="login"><input required type="email" id="email" placeholder="البريد الإلكتروني"><button>دخول إلى الحساب ↗</button></form><small>للتجربة: استخدم البريد الذي سجلت به.</small></section></main><script>document.getElementById('login').onsubmit=function(e){e.preventDefault();var u=JSON.parse(localStorage.getItem('mviUser')||'null');if(!u||u.email!==document.getElementById('email').value){alert('لم نجد حسابًا بهذا البريد على هذا الجهاز.');return}location.href='dashboard.html'};</script></body></html>
