<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ابدأ تجربتك | MVI</title><link rel="stylesheet" href="styles.css"></head><body><main class="trial-page"><a class="brand" href="index.html">MVI<span>.</span></a><section class="trial-card"><div class="eyebrow"><span></span> 3 أيام مجانًا</div><h1>ابدأ تجربتك<br><em>الآن.</em></h1><p>أنشئ حساب شركتك في ثواني. التجربة تبدأ فورًا وتستمر 72 ساعة.</p><form id="signup"><input required name="company" placeholder="اسم الشركة"><input required name="name" placeholder="اسم المسؤول"><input required type="email" name="email" placeholder="البريد الإلكتروني"><input required type="password" minlength="6" name="password" placeholder="كلمة المرور"><select required name="plan"><option value="">الباقة بعد التجربة (اختياري)</option><option value="1">1 تصميم يوميًا</option><option value="2">2 تصميم يوميًا</option><option value="3">3 تصميمات يوميًا</option><option value="5">5 تصميمات يوميًا</option></select><button>ابدأ 3 أيام مجانًا ↗</button></form><small>لا تحتاج بطاقة بنكية لبدء التجربة.</small></section></main><script>document.getElementById('signup').onsubmit=function(e){e.preventDefault();var f=new FormData(this);var user={company:f.get('company'),name:f.get('name'),email:f.get('email'),plan:f.get('plan'),trialStart:Date.now(),trialEnd:Date.now()+72*60*60*1000,trialDailyLimit:1,trialUsedToday:0,selectedPlan:f.get("plan")};localStorage.setItem('mviUser',JSON.stringify(user));location.href='dashboard.html'};</script></body></html>
